<!DOCTYPE html>
<html lang="en" style="background-color: #000000; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body, #root { background-color: #000 !important; margin: 0; padding: 0; }
      /* Prevent all touch zoom and text selection for kiosk mode */
      html, body {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      #preload-blocker {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2147483647;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.3s ease;
        will-change: opacity;
      }
      #preload-blocker.fade-out {
        opacity: 0;
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Scotian Shelf Explorer's Choice</title>
    <meta name="description" content="Scotian Shelf Explorer's Choice - Museum Kiosk" />
  </head>

  <body style="background-color: #000000;">
    <div id="preload-blocker"></div>
    <div id="root" style="min-height: 100vh; background-color: #000000;"></div>
    <script>
      // Disable right-click context menu
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      // Disable Ctrl+scroll zoom
      document.addEventListener('wheel', function(e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      // Disable keyboard zoom shortcuts
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
